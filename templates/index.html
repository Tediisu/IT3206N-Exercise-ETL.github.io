<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETL Exercise</title>
</head>
<body>
  <h1>Siegfred Noel M. Ungui</h1>
  <h3><i>IT 3206N MW 12:30-3:00PM</i></h3>
  <br>

  <h1>ETL Exercise</h1>

  <h2>1. Upload Source CSV Files</h2>
  <form id="etlForm" method="post" enctype="multipart/form-data">
    {% for name, label in fields %}
    <p>{{ label }}:</p>
    <p><input type="file" name="{{ name }}" accept=".csv" required></p>
    {% endfor %}
    <p><button type="submit">RUN ETL</button></p>
  </form>
  <p id="message" style="color: rgb(206, 28, 28);">{{ message or '' }}</p>

  <h2>2. JSON Output</h2>
  <pre id="output">{{ json_text or '' }}</pre>

  <script>
    document.getElementById('etlForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('message');
      const output = document.getElementById('output');
      
      message.textContent = 'Running ETL...';
      output.textContent = '';
      try {
        const response = await fetch('{{ url_for("run_etl") }}', {method: 'POST', body: new FormData(event.target)});
        const result = await response.json();
        message.textContent = result.message;
        output.textContent = result.ok ? JSON.stringify(result.data, null, 4) : '';
      } catch (err) {
        message.textContent = 'ETL failed: ' + err;
      }
    });
  </script>
</body>
</html>
